version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=names_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      # Dockerfile should be present in the backend directory
    restart: always
    environment:
      - DATABASE_URL=postgres://myuser:mypassword@db:5432/names_db
    depends_on:
      - db
    expose:
      - "8080" # Backend internal port

  frontend:
    build: 
      context: ./frontend
      # Dockerfile should be present in the frontend directory
    restart: always
    depends_on:
      - backend
    expose:
      - "3000" # Frontend internal port

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db_data:
